.hl span.sq{display:inline-block;transform:scaleX(.84);transform-origin:center}
.l1{top:34px;font-size:118px}
.l2{top:140px;font-size:118px}
.grad{background:linear-gradient(180deg,var(--red2),var(--red) 55%,var(--deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.bebas .hl{font-family:Bebas;font-weight:400;letter-spacing:1px}

.row p{font-weight:500;font-size:31px;letter-spacing:-.4px;margin-right:2px}
.row img{width:62px;height:62px;border-radius:50%;box-shadow:0 4px 12px rgba(31,11,11,.12);background:#fff}
/* photo */
.photo{left:1508px;top:42px;width:510px}

.badge{left:1812px;top:318px;width:184px;padding:12px 8px 14px 16px;background:rgba(255,255,255,.92);border-radius:14px;transform:rotate(-12deg);box-shadow:0 8px 20px rgba(196,3,3,.15)}
.badge p{font-weight:800;font-style:normal;font-size:24px;line-height:1.14;transform:skewX(-8deg);white-space:nowrap;background:linear-gradient(90deg,var(--red),var(--red2));-webkit-background-clip:text;background-clip:text;color:transparent}
.doodle{left:1950px;top:262px}
