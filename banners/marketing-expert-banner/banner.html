<!doctype html><html><head><meta charset="utf-8"><style>
/* Profile banner, same layout as the original (2000x504), in blue #3067FF and white #FEFEFE. */
@font-face{font-family:Inter;font-weight:500;src:url(fonts/Inter-Medium.otf)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter-SemiBold.otf)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/Inter-Bold.otf)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/Inter-ExtraBold.otf)}
@font-face{font-family:HeadSerif;font-weight:700;src:url(fonts/LiberationSerif-Bold.ttf)}
@font-face{font-family:Bebas;src:url(fonts/BebasNeue-Regular.ttf)}
:root{--blue:#3067FF;--blue2:#5A88FF;--blue3:#1C4FE0;--white:#FEFEFE;--ink:#0F1B3D}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2000px;height:504px;overflow:hidden}
body{position:relative;font-family:Inter,sans-serif;color:var(--ink);background:var(--white);
 background-image:linear-gradient(rgba(48,103,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(48,103,255,.07) 1px,transparent 1px);background-size:54px 54px;background-position:-1px -1px}
.blob{position:absolute;border-radius:50%;background:rgba(48,103,255,.08)}
.abs{position:absolute}
/* top-left claim (where the logo text was) */
.claim{left:32px;top:22px;display:flex;align-items:center;gap:12px;height:58px;padding:0 22px 0 9px;border-radius:16px;background:#fff;border:2px solid rgba(48,103,255,.25);box-shadow:0 10px 24px rgba(48,103,255,.16);font-weight:700;font-size:25px;letter-spacing:-.4px;color:var(--ink);white-space:nowrap}
.claim i{width:40px;height:40px;border-radius:11px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.claim svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.claim b{color:var(--blue);font-weight:800}
/* headline */
.hl{left:0;width:1960px;text-align:center;font-family:HeadSerif;font-weight:700;line-height:1;white-space:nowrap}
.hl span.sq{display:inline-block;transform:scaleX(.84);transform-origin:center}
.l1{top:34px;font-size:118px}
.l2{top:140px;font-size:118px}
.grad{background:linear-gradient(180deg,var(--blue2),var(--blue) 55%,var(--blue3));-webkit-background-clip:text;background-clip:text;color:transparent}
.bebas .hl{font-family:Bebas;font-weight:400;letter-spacing:1px}
.bebas .l1,.bebas .l2{font-size:132px}
.bebas .l1{top:28px}.bebas .l2{top:146px}
.bebas .hl span.sq{transform:none}
/* skills pill */
.pill{left:460px;top:285px;width:1020px;height:84px;border:3px solid var(--blue);border-radius:44px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:space-evenly;font-weight:500;font-size:30px;letter-spacing:-.4px;box-shadow:0 10px 26px rgba(48,103,255,.12)}
.pill i{width:3px;height:42px;border-radius:2px;background:var(--blue)}
/* expert row */
.row{left:474px;top:412px;display:flex;align-items:center;gap:22px}
.row p{font-weight:500;font-size:31px;letter-spacing:-.4px;margin-right:2px}
.row img{width:66px;height:54px;object-fit:contain;display:block}
/* photo */
.photo{left:1508px;top:42px;width:510px}
</style></head><body>
<div class="blob" style="width:420px;height:420px;left:-170px;bottom:-250px"></div>
<div class="blob" style="width:260px;height:260px;left:780px;top:-200px;background:rgba(48,103,255,.06)"></div>
<div class="blob" style="width:300px;height:300px;right:-120px;top:-170px;background:rgba(48,103,255,.06)"></div>

<div class="abs claim"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Worked With <b>75+ Happy Clients</b></div>

<div class="abs hl l1"><span class="sq">Marketing Expert &amp;</span></div>
<div class="abs hl l2"><span class="sq"><span class="grad">AI Search</span>&nbsp; Specialist</span></div>

<div class="abs pill"><span>SEO &amp; Growth Strategist</span><i></i><span>AI Automation</span><i></i><span>GoHighLevel Expert</span></div>

<div class="abs row"><p>Expert in</p>
 <img src="img/logos/shopify.png"><img src="img/logos/highlevel.png"><img src="img/logos/n8n.png"><img src="img/logos/meta.png"><img src="img/logos/wordpress.png"><img src="img/logos/google-ads.png"><img src="img/logos/icon-9.png">
 <p style="margin-left:4px">&amp; More</p></div>

<img class="abs photo" src="img/cutout.png">

<script>if(location.hash==='#bebas')document.body.classList.add('bebas')</script>
</body></html>
