<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Poppins;font-weight:800;src:url(fonts/Poppins-ExtraBold.ttf)}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/Poppins-Medium.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:Poppins,sans-serif;background:linear-gradient(38deg,#A5000C 0%,#C8000A 45%,#FF0000 100%)}
.sheen{position:absolute;inset:0;background:radial-gradient(70% 55% at 92% 8%,rgba(255,120,110,.22),transparent 60%),radial-gradient(60% 50% at 0% 100%,rgba(12,12,14,.28),transparent 70%)}
svg.shapes{position:absolute;inset:0;width:1080px;height:1350px}
.glow{position:absolute;left:520px;top:520px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,80,.35),transparent 65%);filter:blur(20px)}
.person{position:absolute;right:-22px;bottom:0;height:860px;
 filter:drop-shadow(-22px 14px 28px rgba(12,12,14,.55)) drop-shadow(0 0 1.5px rgba(12,12,14,.35))}
h1{position:absolute;left:80px;top:72px;width:940px;color:#fff;font-weight:800;font-size:92px;line-height:1.04;letter-spacing:-2px;
 text-shadow:0 4px 12px rgba(12,12,14,.38),0 2px 2px rgba(12,12,14,.22)}
h1 span{display:block}
h1 .l2{margin-top:10px}
.pill{position:absolute;left:80px;top:520px;width:370px;background:rgba(12,12,14,.8);color:#fff;font-weight:500;font-size:29px;line-height:1.34;
 padding:24px 28px;border-radius:26px;box-shadow:0 12px 28px rgba(12,12,14,.3)}
.icons{position:absolute;left:80px;top:716px;display:flex;gap:16px}
.icons .ic{width:64px;height:64px;border:2.5px solid #fff;border-radius:50%;display:grid;place-items:center}
.icons svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.swipe{position:absolute;right:80px;bottom:80px;width:80px;height:80px;border-radius:50%;border:3px solid #fff;background:rgba(12,12,14,.35);display:grid;place-items:center}
.swipe svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="sheen"></div>
<svg class="shapes" viewBox="0 0 1080 1350">
 <defs>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="6" dy="10" stdDeviation="10" flood-color="#0C0C0E" flood-opacity=".45"/></filter>
  <polygon id="hex" points="50,0 100,28.9 100,86.6 50,115.5 0,86.6 0,28.9"/>
 </defs>
 <!-- diagonal bars behind subject -->
 <g filter="url(#sh)">
  <rect x="760" y="250" width="70" height="1300" fill="#111111" opacity=".28" transform="rotate(28 795 900)"/>
  <rect x="900" y="200" width="34" height="1300" fill="#0C0C0E" opacity=".30" transform="rotate(28 917 850)"/>
  <rect x="610" y="420" width="18" height="1200" fill="#0C0C0E" opacity=".22" transform="rotate(28 619 1020)"/>
 </g>
 <!-- top-right hexagons -->
 <g fill="none" stroke="#0C0C0E" stroke-width="3" filter="url(#sh)">
  <use href="#hex" transform="translate(940 -20) scale(1.5)" opacity=".35"/>
  <use href="#hex" transform="translate(905 180) scale(.9)" opacity=".28"/>
  <use href="#hex" transform="translate(1010 250) scale(.6)" opacity=".25"/>
 </g>
 <!-- behind subject hexagon -->
 <use href="#hex" transform="translate(560 560) scale(2.6)" fill="none" stroke="#111111" stroke-width="2" opacity=".22" filter="url(#sh)"/>
 <!-- bottom-left triangles -->
 <g filter="url(#sh)">
  <polygon points="-40,1390 300,1390 40,1080" fill="#0C0C0E" opacity=".30"/>
  <polygon points="150,1390 380,1390 250,1190" fill="none" stroke="#111111" stroke-width="3" opacity=".35"/>
  <polygon points="80,960 150,1000 70,1040" fill="none" stroke="#0C0C0E" stroke-width="3" opacity=".3"/>
 </g>
</svg>
<div class="glow"></div>
<img class="person" src="person.png">
<h1><span>Your website</span><span>gets visitors.</span><span class="l2">So why is</span><span>nobody calling?</span></h1>
<div class="pill">7 SEO mistakes, and how to check each one in <span style="white-space:nowrap">2 minutes.</span></div>
<div class="icons">
 <div class="ic"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></div>
 <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.3v.2"/></svg></div>
</div>
<div class="swipe"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
</body></html>
