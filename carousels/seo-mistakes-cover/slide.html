<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Poppins;font-weight:800;src:url(fonts/Poppins-ExtraBold.ttf)}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/Poppins-Medium.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;background:#A5000C;font-family:Poppins,sans-serif}
.grid{position:absolute;inset:0;
 background-image:radial-gradient(rgba(12,12,14,.22) 1.6px,transparent 1.8px);
 background-size:36px 36px;background-position:18px 18px}
.vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 20% 10%,rgba(255,40,50,.10),transparent 55%),linear-gradient(180deg,transparent 60%,rgba(12,12,14,.18))}
.diag{position:absolute;left:470px;top:330px;width:900px;height:1400px;background:#0C0C0E;
 transform:skewX(-14deg);transform-origin:bottom left;opacity:.92;border-radius:28px;filter:blur(1px)}
.glow{position:absolute;left:560px;top:640px;width:560px;height:560px;border-radius:50%;
 background:radial-gradient(circle,rgba(12,12,14,.65),transparent 70%);filter:blur(30px)}
.edge{position:absolute;left:452px;top:330px;width:10px;height:1400px;background:rgba(255,255,255,.14);transform:skewX(-14deg);transform-origin:bottom left}
.person{position:absolute;right:-48px;bottom:0;width:690px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%);
 filter:drop-shadow(-18px 10px 26px rgba(12,12,14,.55)) drop-shadow(0 0 2px rgba(12,12,14,.4))}
.icons{position:absolute;left:80px;top:80px;display:flex;gap:18px}
.icons .ic{width:66px;height:66px;border:2.5px solid rgba(255,255,255,.9);border-radius:18px;display:grid;place-items:center}
.icons svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h1{position:absolute;left:80px;top:178px;width:920px;color:#fff;font-weight:800;font-size:96px;line-height:1.04;letter-spacing:-2px;
 text-shadow:0 4px 10px rgba(12,12,14,.35),0 2px 2px rgba(12,12,14,.25)}
.pill{position:absolute;left:80px;top:650px;width:430px;background:#0C0C0E;color:#fff;font-weight:500;font-size:33px;line-height:1.32;
 padding:30px 34px;border-radius:30px;box-shadow:0 14px 30px rgba(12,12,14,.35)}
.swipe{position:absolute;left:80px;bottom:80px;width:84px;height:84px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center}
.swipe svg{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="grid"></div><div class="vignette"></div>
<div class="diag"></div><div class="edge"></div><div class="glow"></div>
<img class="person" src="person.png">
<div class="icons">
 <div class="ic"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></div>
 <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 4h3l1.5 4-2 1.3a11 11 0 0 0 5.2 5.2l1.3-2 4 1.5v3a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/><path d="M15 3.5l5.5 5.5M20.5 3.5 15 9"/></svg></div>
 <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 5l5.5 6 4-3.5L21 17"/><path d="M15 17h6v-6"/></svg></div>
</div>
<h1>Your website<br>gets visitors.<br>So why is<br>nobody calling?</h1>
<div class="pill">7 SEO mistakes, and how to check each one in 2 minutes.</div>
<div class="swipe"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
</body></html>
