<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/Poppins-Regular.ttf)}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/Poppins-Medium.ttf)}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/Poppins-Bold.ttf)}
@font-face{font-family:Poppins;font-weight:800;src:url(fonts/Poppins-ExtraBold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:Poppins,sans-serif;color:#111111;background:#FFF7F8}
.blob{position:absolute;border-radius:50%;filter:blur(60px)}
#scene{position:absolute;left:0;top:0}
/* header */
.hd{position:absolute;left:0;right:0;top:40px;text-align:center}
.kick{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:4px;color:#FF0031;background:#fff;border:1.5px solid rgba(255,0,49,.25);border-radius:30px;padding:6px 18px}
.kick i{width:8px;height:8px;border-radius:50%;background:#FF0031;display:block}
h1{margin-top:12px;font-weight:800;font-size:96px;line-height:1;letter-spacing:-2.5px;color:#FF0031;text-shadow:5px 5px 0 #FFC7D1}
h1 span{color:#111;text-shadow:5px 5px 0 #FFC7D1}
.sub{margin-top:12px;font-weight:700;font-size:28px;letter-spacing:2px;color:#111}
.sub b{color:#FF0031}
/* steps */
.step{position:absolute}
.step h3{font-weight:800;font-size:23px;line-height:1.15;letter-spacing:.3px;color:#111;text-transform:uppercase}
.step p{margin-top:7px;font-weight:400;font-size:16.5px;line-height:1.5;color:#3A3A3A}
.step p b{font-weight:600;color:#FF0031}
.num{position:absolute;width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#FF3358,#FF0031 60%,#D80029);color:#fff;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 7px #fff,0 8px 20px rgba(255,0,49,.35)}
.icon{position:absolute;width:112px;height:112px;border-radius:50%;background:#fff;box-shadow:0 0 0 14px rgba(255,0,49,.07),0 12px 26px rgba(255,0,49,.14);display:flex;align-items:center;justify-content:center}
.icon svg{width:50px;height:50px;stroke:#FF0031;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* footer */
.foot{position:absolute;left:0;right:0;bottom:0;height:124px;background:#FF0031;display:flex;align-items:center;justify-content:space-between;padding:0 36px;color:#fff}
.vr{flex:none;width:1.5px;height:62px;background:rgba(255,255,255,.35)}
.me{display:flex;align-items:center;gap:14px}
.av{flex:none;width:76px;height:76px;border-radius:50%;border:3px solid #fff;overflow:hidden;background:#fff}
.av img{width:100%;height:100%;display:block}
.nm b{display:block;font-weight:800;font-size:21px;line-height:1.2}
.nm span{display:block;font-weight:500;font-size:15px;opacity:.92;margin-top:2px}
.svc{font-size:16px;line-height:1.35;font-weight:500;width:262px}
.svc b{font-weight:700}
.rp{flex:none;background:#fff;color:#FF0031;font-weight:800;font-size:20px;letter-spacing:.5px;padding:12px 20px;border-radius:10px;display:flex;align-items:center;gap:9px;box-shadow:0 6px 14px rgba(17,17,17,.18)}
.rp svg{width:22px;height:22px;stroke:#FF0031;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ag{display:flex;align-items:center;gap:11px}
.ag img{height:46px;display:block}
.ag p{font-weight:800;font-size:18px;line-height:1.1;letter-spacing:.3px}
</style></head><body>
<div class="blob" style="width:420px;height:420px;right:-160px;top:-140px;background:rgba(255,0,49,.20)"></div>
<div class="blob" style="width:360px;height:360px;left:-170px;top:360px;background:rgba(255,0,49,.13)"></div>
<div class="blob" style="width:380px;height:380px;right:-180px;top:820px;background:rgba(255,0,49,.12)"></div>
<svg id="scene" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>

<div class="hd">
 <div class="kick"><i></i>INSTAGRAM SEO GUIDE<i></i></div>
 <h1>5 SEO <span>Tips</span></h1>
 <div class="sub">TO <b>OPTIMIZE</b> YOUR INSTAGRAM</div>
</div>

<div id="steps"></div>

<div class="foot">
 <div class="me"><div class="av"><img src="avatar.png"></div><div class="nm"><b>Shehroz Shafique</b><span>CEO of Permanent SEO</span></div></div>
 <div class="vr"></div>
 <div class="svc">Helping businesses build their <b>brand &amp; permanent growth</b></div>
 <div class="rp"><svg viewBox="0 0 24 24"><path d="M4 9h13l-3-3"/><path d="M20 15H7l3 3"/></svg>REPOST</div>
 <div class="vr"></div>
 <div class="ag"><img src="logo-white.png"><p>PERMANENT<br>SEO</p></div>
</div>

<script>
const ICONS={
 pin:'<path d="M12 21.5s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9.5" r="2.6"/>',
 cc:'<rect x="2.5" y="4.5" width="19" height="13" rx="3"/><path d="M10.2 9.4a2.2 2.2 0 1 0 0 3.2M16.7 9.4a2.2 2.2 0 1 0 0 3.2"/><path d="M8 17.5l-2 3 4.5-3"/>',
 key:'<rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="M5.5 8h6M5.5 11h4"/><circle cx="16.5" cy="15" r="3.6"/><path d="M19.2 17.7l2.6 2.6"/>',
 cap:'<path d="M4 4.5h11l4 4V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1z"/><path d="M15 4.5V9h4"/><path d="M6.5 11.5h8M6.5 14.5h5"/><path d="M13 18.5l5.8-5.8 1.7 1.7-5.8 5.8H13z"/>',
 hash:'<path d="M9.5 3.5L7.5 20.5M16.5 3.5l-2 17M4 9h16.5M3.5 15H20"/>'
};
const STEPS=[
 {t:'Use Geotags',p:'Tag your post\'s location so Instagram can show it to <b>people near you</b>.',i:'pin'},
 {t:'Add On-Screen Captions',p:'Instagram reads the text in your videos. It uses those words to understand your post and <b>show it to the right people</b>.',i:'cc'},
 {t:'Use Keywords on Screen',p:'Add your main keyword to the text on your post. Local business? <b>Add your city name.</b>',i:'key'},
 {t:'Write SEO-Friendly Captions',p:'Use the words your audience actually searches for. This helps Instagram <b>categorize your content</b>.',i:'cap'},
 {t:'Use Relevant Hashtags',p:'Skip random tags. A few <b>relevant hashtags</b> put your post in front of the right audience.',i:'hash'},
];
const top0=268,H=186,R=H/2,leftX=225,rightX=855,W=470; // shapes: odd = round on left, even = round on right
const sc=document.getElementById('scene'),st=document.getElementById('steps');
let svg='<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#FF0031" flood-opacity=".10"/></filter></defs>';
let line='';
STEPS.forEach((s,k)=>{
 const y0=top0+k*H,y1=y0+H,ym=y0+R,L=k%2==0;
 const a=L?leftX:rightX-W, b=L?leftX+W:rightX; // shape x range
 // guide line across the page through the middle of each step
 svg+=`<path d="M0 ${ym} H1080" stroke="#FF0031" stroke-opacity=".10" stroke-width="2"/>`;
 // card shape (half stadium)
 const d=L?`M${b} ${y0} H${a+R} A${R} ${R} 0 0 0 ${a+R} ${y1} H${b} Z`:`M${a} ${y0} H${b-R} A${R} ${R} 0 0 1 ${b-R} ${y1} H${a} Z`;
 svg+=`<path d="${d}" fill="#FFFFFF" filter="url(#sh)"/>`;
 // serpentine path segment
 line+=L?`${k?'':'M'+b+' '+y0} H${a+R} A${R} ${R} 0 0 0 ${a+R} ${y1} H${rightX-W} `:`H${b-R} A${R} ${R} 0 0 1 ${b-R} ${y1} H${leftX+W} `;
 // number circle on the curved edge
 const nx=L?a:b;
 st.insertAdjacentHTML('beforeend',`<div class="num" style="left:${nx-29}px;top:${ym-29}px">${k+1}</div>`);
 // icon on the opposite side
 const ix=L?rightX+40:leftX-40;
 st.insertAdjacentHTML('beforeend',`<div class="icon" style="left:${ix-56}px;top:${ym-56}px"><svg viewBox="0 0 24 24">${ICONS[s.i]}</svg></div>`);
 // text block
 const tx=L?a+60:a+30, tw=W-95;
 st.insertAdjacentHTML('beforeend',`<div class="step" style="left:${tx}px;top:${y0}px;width:${tw}px;height:${H}px;display:flex;flex-direction:column;justify-content:center"><h3>${s.t}</h3><p>${s.p}</p></div>`);
});
svg+=`<path d="M${leftX+W} ${top0} ${line}" fill="none" stroke="#FF0031" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" stroke-opacity=".75"/>`;
sc.innerHTML=svg;
</script>
</body></html>
