<!doctype html><html><head><meta charset="utf-8"><style>
/* Instagram / LinkedIn highlight covers: flat #3067FF background, white line icon.
   covers.html#N renders cover N (0-7) at 1080x1080; covers.html#sheet renders the preview row. */
@font-face{font-family:Inter;font-weight:600;src:url(../carousels/ecommerce-seo-8-reasons/fonts/Inter-SemiBold.otf)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#FEFEFE}
.cover{width:1080px;height:1080px;background:#3067FF;display:flex;align-items:center;justify-content:center}
.cover svg{width:460px;height:460px;stroke:#FEFEFE;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sheet{width:2000px;height:520px;display:flex;align-items:center;justify-content:space-evenly;padding:0 30px}
.item{display:flex;flex-direction:column;align-items:center;gap:22px}
.dot{width:190px;height:190px;border-radius:50%;background:#3067FF;display:flex;align-items:center;justify-content:center;outline:4px solid #FEFEFE;box-shadow:0 0 0 7px #3067FF33}
.dot svg{width:98px;height:98px;stroke:#FEFEFE;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item p{font-weight:600;font-size:27px;color:#14213D}
</style></head><body>
<div id="out"></div>
<script>
const ICONS=[
 ['Start Here','<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>'],
 ['Results','<path d="M3 21h18"/><path d="M6 17v-3M10 17v-6M14 17v-4M18 17V9"/><path d="M4 10l5-4 4 3 7-6"/><path d="M16 3h4v4"/>'],
 ['Websites','<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><circle cx="12" cy="10" r="4"/><path d="M8 10h8M12 6c1.4 1.1 2 2.4 2 4s-.6 2.9-2 4c-1.4-1.1-2-2.4-2-4s.6-2.9 2-4z"/>'],
 ['AI Systems','<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/><path d="M12 8.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>'],
 ['My Results','<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>'],
 ['Client Feedback','<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 6.3l1.1 2.2 2.4.35-1.75 1.7.42 2.4L12 11.8l-2.17 1.15.42-2.4-1.75-1.7 2.4-.35z"/>'],
 ['About Me','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'],
 ['Book a Meeting','<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>'],
];
const h=location.hash.slice(1),out=document.getElementById('out');
if(h==='sheet'){
 out.innerHTML='<div class="sheet">'+ICONS.map(([n,p])=>`<div class="item"><div class="dot"><svg viewBox="0 0 24 24">${p}</svg></div><p>${n}</p></div>`).join('')+'</div>';
}else{
 out.innerHTML=`<div class="cover"><svg viewBox="0 0 24 24">${ICONS[+h||0][1]}</svg></div>`;
}
</script>
</body></html>
